
name: Check Runner Disk Space

on:
  workflow_dispatch:

jobs:
  check-space:
    runs-on: ubuntu-latest

    steps:
      - name: Show Disk Usage
        run: |
          echo "=== Filesystem ==="
          df -h /

          echo "=== Inodes ==="
          df -i /

          echo "=== Block Devices ==="
          lsblk

          echo "=== Runner Information ==="
          uname -a
