name: Build and Push RAG Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "v1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Show runner disk space
        run: df -h /

      - name: Verify Docker
        run: |
          docker --version
          docker info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face downloader
        run: |
          python -m pip install --upgrade "huggingface_hub<2.0"

      - name: Download Qwen2.5-VL-3B-Instruct
        run: |
          mkdir -p models/qwen2.5-vl-3b

          python -c "
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id='Qwen/Qwen2.5-VL-3B-Instruct',
              local_dir='models/qwen2.5-vl-3b'
          )
          "

      - name: Download Qwen3-Embedding-0.6B
        run: |
          mkdir -p models/qwen3-embedding-0.6b

          python -c "
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id='Qwen/Qwen3-Embedding-0.6B',
              local_dir='models/qwen3-embedding-0.6b'
          )
          "

      - name: Verify VLM model
        run: |
          test -f models/qwen2.5-vl-3b/config.json
          test -n "$(find models/qwen2.5-vl-3b -name '*.safetensors' -type f -print -quit)"
          echo "Qwen2.5-VL-3B-Instruct verification passed."

      - name: Verify embedding model
        run: |
          test -f models/qwen3-embedding-0.6b/config.json
          test -n "$(find models/qwen3-embedding-0.6b -name '*.safetensors' -type f -print -quit)"
          echo "Qwen3-Embedding-0.6B verification passed."

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Build RAG image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ghcr.io/${IMAGE_OWNER}/amd-rag:${{ inputs.tag }} \
            .

      - name: Push RAG image
        run: |
          docker push \
            ghcr.io/${IMAGE_OWNER}/amd-rag:${{ inputs.tag }}

      - name: Show published image
        run: |
          echo "Published:"
          echo "ghcr.io/${IMAGE_OWNER}/amd-rag:${{ inputs.tag }}"
