name: Build and Push RAG Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: "v1"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Show runner disk space
        run: |
          echo "=== Disk space ==="
          df -h

          echo "=== Inode usage ==="
          df -i

          echo "=== Docker disk usage ==="
          docker system df -v

          echo "=== Docker root directory ==="
          docker info | grep -i "Docker Root Dir"

          echo "=== Docker and containerd storage ==="
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true

      - name: Verify Docker
        run: |
          docker --version
          docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Hugging Face downloader
        run: |
          python -m pip install --upgrade "huggingface_hub<2.0"

      - name: Download Qwen2.5-VL-3B-Instruct
        run: |
          mkdir -p "03 Retrieval-Augmented-Generation/models/qwen2.5-vl-3b"

          python -c "
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id='Qwen/Qwen2.5-VL-3B-Instruct',
              local_dir='03 Retrieval-Augmented-Generation/models/qwen2.5-vl-3b'
          )
          "

      - name: Download Qwen3-Embedding-0.6B
        run: |
          mkdir -p "03 Retrieval-Augmented-Generation/models/qwen3-embedding-0.6b"

          python -c "
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id='Qwen/Qwen3-Embedding-0.6B',
              local_dir='03 Retrieval-Augmented-Generation/models/qwen3-embedding-0.6b'
          )
          "

      - name: Verify VLM model
        run: |
          test -f "03 Retrieval-Augmented-Generation/models/qwen2.5-vl-3b/config.json"

          test -n "$(find "03 Retrieval-Augmented-Generation/models/qwen2.5-vl-3b" -name '*.safetensors' -type f -print -quit)"

          echo "Qwen2.5-VL-3B-Instruct verification passed."

      - name: Verify embedding model
        run: |
          test -f "03 Retrieval-Augmented-Generation/models/qwen3-embedding-0.6b/config.json"

          test -n "$(find "03 Retrieval-Augmented-Generation/models/qwen3-embedding-0.6b" -name '*.safetensors' -type f -print -quit)"

          echo "Qwen3-Embedding-0.6B verification passed."

      - name: Check downloaded model sizes
        run: |
          echo "=== Downloaded model sizes ==="
          du -sh "03 Retrieval-Augmented-Generation/models/"*

          echo "=== Disk space after downloads ==="
          df -h /

          echo "=== Inodes after downloads ==="
          df -i /

          echo "=== Docker storage ==="
          docker system df -v

          echo "=== Storage directories ==="
          sudo du -sh /var/lib/docker /var/lib/containerd 2>/dev/null || true

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Check Storage Before Build
        run: |
          echo "=== Disk ==="
          df -h /

          echo "=== Inodes ==="
          df -i /

          echo "=== Model Sizes ==="
          du -sh "03 Retrieval-Augmented-Generation/models/"*

          echo "=== Containerd Usage ==="
          sudo du -sh /var/lib/containerd

          echo "=== Docker Usage ==="
          docker system df -v

      - name: Build and Push RAG image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f "03 Retrieval-Augmented-Generation/Dockerfile" \
            -t ghcr.io/${IMAGE_OWNER}/amd-rag:${{ inputs.tag }} \
            --push \
            "03 Retrieval-Augmented-Generation"

      - name: Check Storage After Build
        if: always()
        run: |
          echo "=== Disk ==="
          df -h /

          echo "=== Inodes ==="
          df -i /

          echo "=== Containerd Usage ==="
          sudo du -sh /var/lib/containerd

          echo "=== Containerd Snapshots ==="
          sudo du -sh /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs 2>/dev/null || true

          echo "=== Docker Usage ==="
          docker system df -v

      - name: Show published image
        if: success()
        run: |
          echo "Published:"
          echo "ghcr.io/${IMAGE_OWNER}/amd-rag:${{ inputs.tag }}"
